<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyHackMD - Markdown Editor</title>
    <link rel="stylesheet" href="style.css">
    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/lib/codemirror.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/theme/monokai.css">
    <!-- KaTeX CSS (v0.16.9) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <!-- texmath CSS (v1.0.0) - Important for layout -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/markdown-it-texmath@1.0.0/css/texmath.css">
    <!-- markdown-it JS -->
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@13.0.1/dist/markdown-it.min.js"></script>
    <!-- KaTeX JS (v0.16.9) -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <!-- texmath JS (v1.0.0) - This is the bridge -->
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-texmath@1.0.0/texmath.min.js"></script>
    <!-- CodeMirror JS -->
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/lib/codemirror.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/mode/markdown/markdown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/addon/edit/closebrackets.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/addon/edit/matchbrackets.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/addon/selection/active-line.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/addon/display/autorefresh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/addon/search/search.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/addon/search/searchcursor.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/addon/search/jump-to-line.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/addon/dialog/dialog.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/addon/dialog/dialog.css">
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/addon/hint/show-hint.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.2/addon/hint/show-hint.css">
    <!-- Socket.IO Client -->
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.2/dist/socket.io.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>MyHackMD</h1>
                <div class="header-buttons">
                    <button id="newFolderBtn" class="new-folder-btn" title="Create Folder">📁</button>
                    <button id="newFileBtn" class="new-file-btn" title="New File">+</button>
                </div>
            </div>
            <div class="file-tree" id="fileTree">
                <div class="loading">Loading files...</div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <div class="editor-container">
                <!-- Editor Panel -->
                <div class="editor-panel">
                    <div class="panel-header">
                        <span class="panel-title">Editor</span>
                        <span id="editorFileName" class="file-name-display"></span>
                        <span id="saveStatus" class="save-status"></span>
                    </div>
                    <div id="editor"></div>
                </div>

                <!-- Preview Panel -->
                <div class="preview-panel">
                    <div class="panel-header">
                        <span class="panel-title">Preview</span>
                        <span id="previewFileName" class="file-name-display"></span>
                        <div class="panel-actions">
                            <button id="viewModeBtn" class="mode-toggle-btn active" title="View Mode (👁️)">👁️</button>
                            <button id="editModeBtn" class="mode-toggle-btn" title="Edit Mode (✏️)">✏️</button>
                            <div class="action-separator"></div>
                            <button id="exportPdfBtn" class="export-btn" title="Export as PDF">📄 PDF</button>
                            <button id="exportMdBtn" class="export-btn" title="Export as Markdown">📝 MD</button>
                        </div>
                    </div>
                    <div id="preview" class="preview-content"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
